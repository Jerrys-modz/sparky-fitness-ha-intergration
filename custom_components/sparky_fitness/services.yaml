log_water:
  name: Log water
  description: >-
    Log a water intake reading to SparkyFitness for today.
  fields:
    value:
      name: Amount
      description: Water amount in milliliters (mL).
      required: true
      example: 250
      selector:
        number:
          min: 1
          max: 5000
          unit_of_measurement: mL
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured. Find the ID under Settings > Devices & Services >
        SparkyFitness > (each entry's) three-dot menu > Device info.
      required: false
      example: "01H..."
      selector:
        text:

log_weight:
  name: Log weight
  description: >-
    Log a weight reading to SparkyFitness for today. SparkyFitness stores
    weight in kilograms internally, so send kg here regardless of the unit
    shown in the SparkyFitness UI.
  fields:
    value:
      name: Weight
      description: Weight in kilograms (kg).
      required: true
      example: 70.5
      selector:
        number:
          min: 1
          max: 500
          step: 0.1
          unit_of_measurement: kg
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

log_food:
  name: Log food
  description: >-
    Search SparkyFitness's food database by name and log the closest match
    for today. Returns what was actually logged, so you can confirm the
    match was right.
  fields:
    name:
      name: Food name
      description: What to search for, e.g. "banana" or "grilled chicken breast".
      required: true
      example: banana
      selector:
        text:
    meal_type:
      name: Meal
      description: >-
        Must match a meal type name that exists in your SparkyFitness
        account (defaults typically include breakfast/lunch/dinner/snacks).
      required: false
      default: snacks
      selector:
        text:
    servings:
      name: Servings
      description: >-
        Multiplier on the food's default serving size (1 = one default
        serving).
      required: false
      default: 1.0
      selector:
        number:
          min: 0.01
          max: 50
          step: 0.25
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

search_food_choices:
  name: Search food choices
  description: >-
    Read-only food search — returns up to `limit` candidate matches instead
    of logging anything, so a caller (e.g. a dashboard chat card) can show
    "did you mean X, Y, or Z?" and let the user pick before logging.
  fields:
    name:
      name: Food name
      description: What to search for, e.g. "banana" or "grilled chicken breast".
      required: true
      example: chicken
      selector:
        text:
    limit:
      name: Max results
      description: How many candidates to return.
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

log_food_choice:
  name: Log food choice
  description: >-
    Log one specific food entry already identified by food_id/variant_id —
    the follow-up half of search_food_choices, once the user has picked
    which candidate they meant.
  fields:
    food_id:
      name: Food ID
      description: The `food_id` from a search_food_choices result.
      required: true
      selector:
        text:
    variant_id:
      name: Variant ID
      description: The `variant_id` from a search_food_choices result, if any.
      required: false
      selector:
        text:
    quantity:
      name: Quantity
      description: Amount to log, in the choice's serving_unit (e.g. grams).
      required: true
      example: 100
      selector:
        number:
          min: 0.01
          max: 10000
          mode: box
    unit:
      name: Unit
      description: The `serving_unit` from the search_food_choices result.
      required: false
      selector:
        text:
    meal_type:
      name: Meal
      description: >-
        Must match a meal type name that exists in your SparkyFitness
        account (defaults typically include breakfast/lunch/dinner/snacks).
      required: false
      default: snacks
      selector:
        text:
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

log_exercise:
  name: Log exercise
  description: >-
    Search SparkyFitness's exercise database by name and log it for today
    with the given duration. Calories burned are calculated by SparkyFitness
    from the matched exercise's calorie rate.
  fields:
    name:
      name: Exercise name
      description: What to search for, e.g. "running" or "bench press".
      required: true
      example: running
      selector:
        text:
    duration_minutes:
      name: Duration
      description: Duration in minutes.
      required: true
      example: 30
      selector:
        number:
          min: 0.1
          max: 1440
          unit_of_measurement: min
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

search_exercise_choices:
  name: Search exercise choices
  description: >-
    Read-only exercise search — returns up to `limit` candidate matches
    instead of logging anything, so a caller (e.g. a dashboard chat card) can
    show "did you mean X, Y, or Z?" and let the user pick before logging.
  fields:
    name:
      name: Exercise name
      description: What to search for, e.g. "running" or "bench press".
      required: true
      example: running
      selector:
        text:
    limit:
      name: Max results
      description: How many candidates to return.
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

get_exercise_history:
  name: Get exercise history
  description: >-
    Read-only, on-demand list of recent completed workouts (name, calories,
    duration) over the given number of days — used by the exercise-history
    dashboard card. Fetches one daily-summary request per day in range, so
    it's meant to be called when a card loads/refreshes, not on a schedule.
  fields:
    days:
      name: Days
      description: How many days back to look.
      required: false
      default: 14
      selector:
        number:
          min: 1
          max: 90
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

get_muscle_group_summary:
  name: Get muscle group summary
  description: >-
    Read-only, on-demand sets-per-muscle-group breakdown — used by the
    muscle-map dashboard card. Fetches one daily-summary request per day in
    range, so it's meant to be called when a card loads/refreshes, not on a
    schedule. Primary muscles get full credit per set, secondary muscles
    get half credit; exercises with no muscle/category data in
    SparkyFitness's catalog are skipped.
  fields:
    days:
      name: Days
      description: Size of the window to summarize, ending at end_date.
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 90
          mode: box
    end_date:
      name: End date
      description: >-
        Last day of the window (YYYY-MM-DD). Defaults to today — pass an
        earlier date to page back to a previous week.
      required: false
      example: "2026-08-17"
      selector:
        text:
    include_recovery:
      name: Include recovery
      description: >-
        Also compute days-since-last-worked per muscle group, looking back
        further than `days` when needed (at least 21 days). Off by default.
      required: false
      default: false
      selector:
        boolean:
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

get_exercise_trend:
  name: Get exercise trend
  description: >-
    Read-only, on-demand one-rep-max trend for a single exercise, for the
    exercise-trend dashboard card. Resolves the exercise name the same way
    log_exercise does (first search match), then estimates a 1RM per session
    (Epley formula: weight * (1 + reps/30), the same formula SparkyFitness's
    own Personal Records page uses) from that exercise's recent set history.
  fields:
    name:
      name: Exercise name
      description: What to search for, e.g. "bench press" or "squat".
      required: true
      example: bench press
      selector:
        text:
    sessions:
      name: Sessions
      description: How many recent sessions (workouts, not calendar days) to analyze.
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 50
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

get_progression_suggestion:
  name: Get progression suggestion
  description: >-
    Read-only "what should I lift next time" suggestion for a single
    exercise, via double progression (work a weight for reps within
    reps_low..reps_high; once every working set hits reps_high, add weight
    and drop back to reps_low) — the same basic scheme most strength-training
    apps build their own suggested-weight feature on. Resolves the exercise
    name the same way log_exercise/get_exercise_trend do (first search
    match), then looks at its most recent set(s) logged with a real weight.
  fields:
    name:
      name: Exercise name
      description: What to search for, e.g. "bench press" or "squat".
      required: true
      example: bench press
      selector:
        text:
    reps_low:
      name: Rep range — low
      description: Bottom of the target rep range.
      required: false
      default: 8
      selector:
        number:
          min: 1
          max: 50
          mode: box
    reps_high:
      name: Rep range — high
      description: >-
        Top of the target rep range — hitting this on every working set
        triggers a weight increase.
      required: false
      default: 12
      selector:
        number:
          min: 1
          max: 50
          mode: box
    weight_increment:
      name: Weight increment
      description: >-
        How much to add (or, after two missed sessions in a row, subtract)
        at a time, in kg.
      required: false
      default: 2.5
      selector:
        number:
          min: 0.1
          max: 50
          step: 0.1
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

get_one_rep_maxes:
  name: Get one-rep maxes
  description: >-
    Read-only current estimated one-rep-maxes across all strength exercises,
    for the personal-records dashboard card. Straight from SparkyFitness's
    own Personal Records matrix — up to 10 exercises, ranked by estimated 1RM.
  fields:
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

get_cardio_prs:
  name: Get cardio PRs
  description: >-
    Read-only cardio distance-milestone personal records (1k, 1 mile, 5k,
    10k, 15k, half/full marathon — best time per sport group), for the
    cardio-records dashboard card. The cardio half of the same Personal
    Records matrix get_one_rep_maxes reads the strength half of.
  fields:
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

get_favorite_routes:
  name: Get favorite routes
  description: >-
    Read-only repeated-route/loop stats (the same run/ride done more than
    once, with a best time and its recent activities) for the
    favorite-routes dashboard card.
  fields:
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

get_custom_measurement_trend:
  name: Get custom measurement trend
  description: >-
    Read-only, on-demand full trend for one custom measurement category
    (e.g. blood pressure), for the custom-measurement-trend dashboard card —
    unlike the category's own sensor, which only carries its latest value.
  fields:
    category:
      name: Category
      description: >-
        A custom measurement category's id, display name, or name
        (case-insensitive) — check Developer Tools > States on that
        category's sensor if unsure.
      required: true
      example: Blood Pressure
      selector:
        text:
    days:
      name: Days
      description: How many days back to fetch.
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 90
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:

log_exercise_choice:
  name: Log exercise choice
  description: >-
    Log one specific exercise entry already identified by exercise_id (from
    search_exercise_choices), bypassing search entirely.
  fields:
    exercise_id:
      name: Exercise ID
      description: The exercise_id from a search_exercise_choices result.
      required: true
      selector:
        text:
    duration_minutes:
      name: Duration
      description: Duration in minutes.
      required: true
      example: 30
      selector:
        number:
          min: 0.1
          max: 1440
          unit_of_measurement: min
          mode: box
    config_entry_id:
      name: SparkyFitness server
      description: >-
        Only needed if you have more than one SparkyFitness server
        configured.
      required: false
      example: "01H..."
      selector:
        text:
